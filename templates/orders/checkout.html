{% extends "base.html" %}

{% block title %}Checkout{% endblock title %}

{% block content %}

<h2 class="mb-4">Checkout</h2>

<form method="POST">
       {% csrf_token %}

       <div class="mb-3">
              <label class="form-label">Delivery Address</label>
              <textarea name="address"
                        class="form-control"
                        rows="3"
                        required></textarea>
       </div>

       <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input type="text"
                     name="phone"
                     class="form-control"
                     required>
       </div>

       <div class="mb-3">
              <label class="form-label">Payment Method</label>
              <input type="text"
                     class="form-control"
                     value="Cash on Delivery"
                     disabled>
       </div>

       <hr>

       <h5>Total: ₹ {{ total }}</h5>

       <button class="btn btn-success mt-3">
              Confirm Order
       </button>

</form>

{% endblock %}
